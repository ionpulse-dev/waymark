[package]
name = "waymark"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
description = "A knowledge base and memory for AI agents: an MCP server over plain Markdown in Git."
license = "MIT"
repository = "https://github.com/ionpulse-dev/waymark"
publish = false

[lib]
name = "waymark"
path = "src/lib.rs"

[dependencies]
yaml-rust2 = "0.13"
regex = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
