[package]
name = "waymark"
version = "0.1.4"
edition = "2021"
rust-version = "1.100"
description = "A knowledge base and memory for AI agents: an MCP server over plain Markdown in Git."
license = "MIT"
repository = "https://github.com/ionpulse-dev/waymark"
publish = false

[lib]
name = "waymark"
path = "src/lib.rs"

[dependencies]
yaml-rust2 = "0.13"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
globset = "0.4"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rmcp = { version = "3.10.0", default-features = false, features = ["server", "macros", "transport-io", "elicitation"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
